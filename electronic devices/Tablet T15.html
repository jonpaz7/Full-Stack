<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tablet T15 - Details</title>
    <script src="script.js" defer></script>
    <script src="secScript.js" defer></script>
    <link rel="stylesheet" href="main.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <main class="product-page-layout">
      <div class="devicepage">
        <div class="gallery-container">
          <img
            id="mainImage"
            class="bigImage"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCkn4eHqrmlVZaw4rlEZkQi656rGb-eN93F4HjuwP7pg&s"
            alt="Tablet T15"
          />
          <div class="thumbnails-container">
            <img
              class="smallImage"
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCkn4eHqrmlVZaw4rlEZkQi656rGb-eN93F4HjuwP7pg&s"
              onclick="showPicture1()"
              alt="Tablet T15 view 1"
            />
            <img
              class="smallImage"
              src="https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=500"
              onclick="showPicture2()"
              alt="Tablet T15 view 2"
            />
            <img
              class="smallImage"
              src="https://images.unsplash.com/photo-1589739900243-4b52cd9b104e?w=500"
              onclick="showPicture3()"
              alt="Tablet T15 view 3"
            />
          </div>
        </div>

        <div class="product-info">
          <h2>Tablet T15</h2>
          <p class="product-price">$399.99</p>
          <p class="product-description">Versatile 10.5-inch tablet ideal for reading, streaming, stylus drawing, and portable daily productivity.</p>
          <button class="btn-add-to-cart" onclick="addtocart()">Add to Cart</button>
          <p id="message"></p>
        </div>
      </div>
    </main>
  </body>
</html>
