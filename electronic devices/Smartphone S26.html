<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smartphone S26 - Details</title>
    <script src="script.js" defer></script>
    <script src="secScript.js" defer></script>
    <link rel="stylesheet" href="main.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <main class="product-page-layout">
      <div class="devicepage">
        <div class="gallery-container">
          <img
            id="mainImage"
            class="bigImage"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsNcZwcWv1-RDlHUNOjL3LocARyGw0sY2d0-jqlWlGKg&s=10"
            alt="Smartphone S26"
          />
          <div class="thumbnails-container">
            <img
              class="smallImage"
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsNcZwcWv1-RDlHUNOjL3LocARyGw0sY2d0-jqlWlGKg&s=10"
              onclick="showPicture1()"
              alt="Smartphone S26 view 1"
            />
            <img
              class="smallImage"
              src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500"
              onclick="showPicture2()"
              alt="Smartphone S26 view 2"
            />
            <img
              class="smallImage"
              src="https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=500"
              onclick="showPicture3()"
              alt="Smartphone S26 view 3"
            />
          </div>
        </div>

        <div class="product-info">
          <h2>Smartphone S26</h2>
          <p class="product-price">$699.99</p>
          <p class="product-description">High-performance smartphone with advanced camera system, 6.7-inch AMOLED display, fast charging, and all-day battery life.</p>
          <button class="btn-add-to-cart" onclick="addtocart()">Add to Cart</button>
          <p id="message"></p>
        </div>
      </div>
    </main>
  </body>
</html>
