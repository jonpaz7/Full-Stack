<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toaster - Details</title>
    <script src="script.js" defer></script>
    <script src="secScript.js" defer></script>
    <link rel="stylesheet" href="main.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <main class="product-page-layout">
      <div class="devicepage">
        <div class="gallery-container">
          <img
            id="mainImage"
            class="bigImage"
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Consumer_Reports_-_Hamilton_Beach_Digital_toaster.tiff/lossless-page1-250px-Consumer_Reports_-_Hamilton_Beach_Digital_toaster.tiff.png?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail"
            alt="Toaster"
          />
          <div class="thumbnails-container">
            <img
              class="smallImage"
              src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Consumer_Reports_-_Hamilton_Beach_Digital_toaster.tiff/lossless-page1-250px-Consumer_Reports_-_Hamilton_Beach_Digital_toaster.tiff.png?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail"
              onclick="showPicture1()"
              alt="Toaster view 1"
            />
            <img
              class="smallImage"
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSH7bMvxk2pS8sP7D2t_3tV0zY45Y1c29eU0Q&s"
              onclick="showPicture2()"
              alt="Toaster view 2"
            />
            <img
              class="smallImage"
              src="https://images.unsplash.com/photo-1585238342024-78d387f4a707?w=500"
              onclick="showPicture3()"
              alt="Toaster view 3"
            />
          </div>
        </div>

        <div class="product-info">
          <h2>Toaster</h2>
          <p class="product-price">$99.99</p>
          <p class="product-description">Digital 2-slice toaster with extra-wide slots, multiple browning controls, bagel mode, and removable crumb tray.</p>
          <button class="btn-add-to-cart" onclick="addtocart()">Add to Cart</button>
          <p id="message"></p>
        </div>
      </div>
    </main>
  </body>
</html>
