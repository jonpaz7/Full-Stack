<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV - Details</title>
    <script src="script.js" defer></script>
    <script src="secScript.js" defer></script>
    <link rel="stylesheet" href="main.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <main class="product-page-layout">
      <div class="devicepage">
        <div class="gallery-container">
          <img
            id="mainImage"
            class="bigImage"
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/RCA_630-TS_Television.jpg/250px-RCA_630-TS_Television.jpg?utm_source=he.wikipedia.org&utm_campaign=parser&utm_content=thumbnail"
            alt="TV"
          />
          <div class="thumbnails-container">
            <img
              class="smallImage"
              src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/RCA_630-TS_Television.jpg/250px-RCA_630-TS_Television.jpg?utm_source=he.wikipedia.org&utm_campaign=parser&utm_content=thumbnail"
              onclick="showPicture1()"
              alt="TV view 1"
            />
            <img
              class="smallImage"
              src="https://images.unsplash.com/photo-1593305841991-05c297ba4575?w=500"
              onclick="showPicture2()"
              alt="TV view 2"
            />
            <img
              class="smallImage"
              src="https://images.unsplash.com/photo-1461151304267-38535e780c79?w=500"
              onclick="showPicture3()"
              alt="TV view 3"
            />
          </div>
        </div>

        <div class="product-info">
          <h2>TV</h2>
          <p class="product-price">$1599.99</p>
          <p class="product-description">Ultra HD 4K Smart Television with vibrant HDR picture quality, Dolby Atmos sound, and integrated smart streaming platforms.</p>
          <button class="btn-add-to-cart" onclick="addtocart()">Add to Cart</button>
          <p id="message"></p>
        </div>
      </div>
    </main>
  </body>
</html>
